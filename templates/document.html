<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Документ — OCR PDF → SQL</title>
<style>
  :root {
    --bg:#0f1117; --surface:#1a1d27; --card:#22263a;
    --accent:#6c63ff; --accent2:#a78bfa;
    --success:#22d3a5; --err:#f87171;
    --text:#e2e8f0; --muted:#8892a4;
    --border:#2d3148; --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
  header{background:#1a1d27;border-bottom:1px solid var(--border);padding:16px 36px;display:flex;align-items:center;gap:16px}
  .logo{font-size:1.4rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .back{color:var(--muted);text-decoration:none;font-size:.9rem}
  .back:hover{color:var(--accent2)}
  main{max-width:1100px;margin:0 auto;padding:28px 24px;display:grid;grid-template-columns:280px 1fr;gap:22px}
  @media(max-width:760px){main{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
  h2{font-size:1rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .meta-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:.84rem}
  .meta-row:last-child{border-bottom:none}
  .meta-lbl{color:var(--muted)}
  .meta-val{font-weight:600;text-align:right;max-width:60%}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.72rem;font-weight:700;text-transform:uppercase}
  .badge-done{background:#0d2e27;color:var(--success)}
  .badge-processing{background:#1c2a4a;color:#60a5fa}
  .badge-error{background:#2e1515;color:var(--err)}
  .badge-pending{background:#1e293b;color:var(--muted)}
  .page-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .page-tab{padding:5px 13px;border-radius:7px;background:var(--surface);border:1px solid var(--border);font-size:.8rem;cursor:pointer;transition:.15s}
  .page-tab:hover,.page-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .text-area{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;font-size:.88rem;line-height:1.8;white-space:pre-wrap;min-height:320px;max-height:600px;overflow-y:auto;font-family:'Courier New',monospace;color:var(--text)}
  .page-stats{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
  .ps{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:5px}
  .ps strong{color:var(--accent2)}
  .conf-bar{height:6px;border-radius:99px;background:var(--border);overflow:hidden;margin-top:6px}
  .conf-fill{height:100%;border-radius:99px}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;border:none;font-size:.85rem;font-weight:600;cursor:pointer;transition:opacity .15s}
  .btn:hover{opacity:.85}
  .btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--border)}
  .empty{text-align:center;padding:50px;color:var(--muted)}
  #copy-btn{float:right}
</style>
</head>
<body>

<header>
  <a class="back" href="/">← Назад</a>
  <div class="logo">📄 OCR PDF → SQL</div>
</header>

<main>
  <!-- Боковая панель -->
  <div>
    <div class="card">
      <h2>📋 Информация</h2>
      <div id="doc-meta"><div class="empty">Загрузка…</div></div>
    </div>

    <div class="card" style="margin-top:16px">
      <h2>📥 Экспорт</h2>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="btn btn-ghost" onclick="exportTxt()">💾 Скачать TXT</button>
        <button class="btn btn-ghost" onclick="exportJson()">📦 Скачать JSON</button>
      </div>
    </div>
  </div>

  <!-- Основная панель -->
  <div>
    <div class="card">
      <h2>
        📝 Распознанный текст
        <button class="btn btn-ghost" id="copy-btn" style="margin-left:auto;padding:5px 12px;font-size:.78rem" onclick="copyAll()">📋 Копировать всё</button>
      </h2>
      <div class="page-tabs" id="page-tabs"></div>
      <div class="text-area" id="text-content">Выберите страницу</div>
      <div class="page-stats" id="page-stats"></div>
    </div>
  </div>
</main>

<script>
const DOC_ID = {{ doc_id }};
let pages = [];
let currentPage = 0;

async function init() {
  // Загружаем метаданные
  const r = await fetch(`/api/documents/${DOC_ID}`);
  if (!r.ok) { document.getElementById('doc-meta').innerHTML = '<div class="empty">Документ не найден</div>'; return; }
  const doc = await r.json();

  document.title = doc.filename + ' — OCR PDF';

  const statusRu = {pending:'ожидание',processing:'обработка',done:'готово',error:'ошибка'};
  const sz = doc.file_size > 1048576
    ? (doc.file_size/1048576).toFixed(2)+' МБ'
    : (doc.file_size/1024).toFixed(0)+' КБ';

  document.getElementById('doc-meta').innerHTML = `
    <div class="meta-row"><span class="meta-lbl">Файл</span><span class="meta-val" title="${doc.filename}">${doc.filename.length>22?doc.filename.slice(0,22)+'…':doc.filename}</span></div>
    <div class="meta-row"><span class="meta-lbl">Размер</span><span class="meta-val">${sz}</span></div>
    <div class="meta-row"><span class="meta-lbl">Страниц</span><span class="meta-val">${doc.page_count}</span></div>
    <div class="meta-row"><span class="meta-lbl">Язык OCR</span><span class="meta-val">${doc.language}</span></div>
    <div class="meta-row"><span class="meta-lbl">Статус</span><span class="meta-val"><span class="badge badge-${doc.status}">${statusRu[doc.status]||doc.status}</span></span></div>
    <div class="meta-row"><span class="meta-lbl">Загружен</span><span class="meta-val">${doc.created_at ? new Date(doc.created_at+'Z').toLocaleString('ru-RU') : '—'}</span></div>
  `;

  if (doc.status === 'done') loadPages();
  else if (doc.status === 'processing' || doc.status === 'pending') {
    document.getElementById('text-content').textContent = 'OCR в процессе, подождите…';
    setTimeout(init, 3000);
  } else if (doc.status === 'error') {
    document.getElementById('text-content').textContent = 'Ошибка: ' + (doc.error_msg || '');
  }
}

async function loadPages() {
  const r = await fetch(`/api/documents/${DOC_ID}/pages`);
  pages   = await r.json();

  const tabs = document.getElementById('page-tabs');
  if (!pages.length) {
    tabs.innerHTML = '';
    document.getElementById('text-content').textContent = 'Текст не распознан';
    return;
  }
  tabs.innerHTML = pages.map((p, i) =>
    `<div class="page-tab ${i===0?'active':''}" onclick="showPage(${i})" id="tab-${i}">Стр. ${p.page_number}</div>`
  ).join('');
  showPage(0);
}

function showPage(idx) {
  currentPage = idx;
  document.querySelectorAll('.page-tab').forEach((t,i) => t.classList.toggle('active', i===idx));
  const p = pages[idx];
  document.getElementById('text-content').textContent = p.raw_text || '(пустая страница)';

  const confColor = p.confidence > 70 ? '#22d3a5' : p.confidence > 40 ? '#f59e0b' : '#f87171';
  document.getElementById('page-stats').innerHTML = `
    <div class="ps">Слов: <strong>${p.word_count}</strong></div>
    <div class="ps">Символов: <strong>${p.char_count}</strong></div>
    <div class="ps" style="flex-direction:column;align-items:flex-start">
      <span>Уверенность OCR: <strong style="color:${confColor}">${p.confidence.toFixed(1)}%</strong></span>
      <div class="conf-bar" style="width:120px">
        <div class="conf-fill" style="width:${p.confidence}%;background:${confColor}"></div>
      </div>
    </div>
    <div class="ps">Движок: <strong>${p.ocr_engine}</strong></div>
  `;
}

function copyAll() {
  const all = pages.map(p => `=== Страница ${p.page_number} ===\n${p.raw_text}`).join('\n\n');
  navigator.clipboard.writeText(all).then(() => alert('Скопировано!'));
}

function exportTxt() {
  const all = pages.map(p => `=== Страница ${p.page_number} ===\n${p.raw_text}`).join('\n\n');
  const a   = document.createElement('a');
  a.href    = URL.createObjectURL(new Blob([all], {type:'text/plain;charset=utf-8'}));
  a.download= `ocr_doc_${DOC_ID}.txt`;
  a.click();
}

function exportJson() {
  const a   = document.createElement('a');
  a.href    = URL.createObjectURL(new Blob([JSON.stringify(pages, null, 2)], {type:'application/json'}));
  a.download= `ocr_doc_${DOC_ID}.json`;
  a.click();
}

init();
</script>
</body>
</html>
